name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-timereport-cli
  cancel-in-progress: false

jobs:
  github-release:
    name: Build GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Require release commit on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Test and build
        run: npm run check

      - name: Verify tag and package versions
        run: npm run verify:release-tag -- "$GITHUB_REF_NAME"

      - name: Build release archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir release
          npm pack --ignore-scripts --pack-destination release
          archive="timereport-cli-${GITHUB_REF_NAME#v}.tgz"
          test -f "release/$archive"
          npm run verify:package-archive -- "release/$archive"
          cd release
          sha256sum "$archive" > "$archive.sha256"

      - name: Create immutable GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; refusing to replace assets." >&2
            exit 1
          fi

          remote_commit=$(
            git ls-remote origin "refs/tags/$GITHUB_REF_NAME^{}" | cut -f1
          )
          if [[ -z "$remote_commit" ]]; then
            remote_commit=$(
              git ls-remote origin "refs/tags/$GITHUB_REF_NAME" | cut -f1
            )
          fi
          workflow_commit=$(git rev-parse "${GITHUB_SHA}^{commit}")
          if [[ "$remote_commit" != "$workflow_commit" ]]; then
            echo "Remote tag no longer points to the workflow commit." >&2
            exit 1
          fi

          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            prerelease+=(--prerelease)
          fi

          gh release create "$GITHUB_REF_NAME" release/* \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME" \
            "${prerelease[@]}"

  npm-publish:
    name: Publish verified archive to npm
    needs: github-release
    if: vars.NPM_TRUSTED_PUBLISHING_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          release_commit=$(git rev-parse "${GITHUB_SHA}^{commit}")
          git merge-base --is-ancestor "$release_commit" origin/main

          remote_commit=$(
            git ls-remote origin "refs/tags/$GITHUB_REF_NAME^{}" | cut -f1
          )
          if [[ -z "$remote_commit" ]]; then
            remote_commit=$(
              git ls-remote origin "refs/tags/$GITHUB_REF_NAME" | cut -f1
            )
          fi
          if [[ "$remote_commit" != "$release_commit" ]]; then
            echo "Remote tag no longer points to the workflow commit." >&2
            exit 1
          fi

          gh release verify "$GITHUB_REF_NAME"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use npm version with trusted publishing support
        run: npm install --global --ignore-scripts npm@12.0.2

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Test package source
        run: npm run check

      - name: Verify tag and package versions
        run: npm run verify:release-tag -- "$GITHUB_REF_NAME"

      - name: Download and verify release archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive="timereport-cli-${GITHUB_REF_NAME#v}.tgz"
          mkdir release
          gh release download "$GITHUB_REF_NAME" \
            --dir release \
            --pattern "$archive"
          gh release download "$GITHUB_REF_NAME" \
            --dir release \
            --pattern "$archive.sha256"
          gh release verify-asset "$GITHUB_REF_NAME" "release/$archive"
          (
            cd release
            sha256sum -c "$archive.sha256"
          )
          npm run verify:package-archive -- "release/$archive"

      - name: Verify npm version ordering
        shell: bash
        run: |
          set -euo pipefail
          package_name=$(node -p "require('./package.json').name")
          package_version=$(node -p "require('./package.json').version")
          if npm view "$package_name@$package_version" version >/dev/null 2>&1; then
            echo "$package_name@$package_version already exists on npm." >&2
            exit 1
          fi

          dist_tag=latest
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            dist_tag=next
          fi
          dist_tags=$(npm view "$package_name" dist-tags --json)
          current_version=$(
            node -e '
              const tags = JSON.parse(process.argv[1]);
              process.stdout.write(tags[process.argv[2]] ?? "");
            ' "$dist_tags" "$dist_tag"
          )
          if [[ -n "$current_version" ]]; then
            npm run verify:version-order -- "$package_version" "$current_version"
          fi
          echo "NPM_DIST_TAG=$dist_tag" >> "$GITHUB_ENV"

      - name: Publish package with provenance
        shell: bash
        run: |
          set -euo pipefail
          archive="timereport-cli-${GITHUB_REF_NAME#v}.tgz"
          if [[ "$NPM_DIST_TAG" == "next" ]]; then
            npm publish "release/$archive" \
              --access public \
              --ignore-scripts \
              --tag "$NPM_DIST_TAG"
          else
            npm publish "release/$archive" \
              --access public \
              --ignore-scripts
          fi
